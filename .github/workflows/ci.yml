name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Correctness gates block; `pnpm verify` locally also enforces the performance budgets.
      - name: Verify (correctness)
        run: pnpm verify:correctness

      # Performance budgets (research R22) are measured and reported on every run. They do not
      # block yet: GitHub-hosted runners measure about 1.5x slower than the calibration machine.
      - name: Benchmark (reference checker)
        continue-on-error: true
        run: pnpm bench

      - name: Benchmark (Core)
        continue-on-error: true
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" || true
          pnpm bench:core

      - name: Benchmark (Web)
        continue-on-error: true
        run: pnpm bench:web
